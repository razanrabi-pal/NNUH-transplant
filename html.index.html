<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transplant Coordinator Tracker — NNUH Kidney Transplant Program</title>
<meta name="description" content="Interactive donor and recipient checklist and follow-up tracker for the An-Najah National University Hospital Kidney Transplant Program.">
<style>
:root{
  --navy:#1f3864; --blue:#2e5c8a; --light:#eaf0f7; --band:#f5f8fc;
  --ink:#16202e; --muted:#5c6b7f; --line:#d6dfea; --bg:#f2f5f9; --card:#fff;
  --ok:#1e7a44; --ok-bg:#e4f4ea; --warn:#8a5a00; --warn-bg:#fdf1d8;
  --bad:#a32020; --bad-bg:#fbe6e4; --na:#6b7684; --na-bg:#eceff3;
  --radius:10px; --shadow:0 1px 2px rgba(20,35,60,.06),0 2px 8px rgba(20,35,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.appbar-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto}
.brand strong{font-size:16px;font-weight:650}
.brand span{font-size:12px;color:#b9c8de}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  border:1px solid transparent;border-radius:8px;padding:7px 13px;font-size:13.5px;font-weight:550;
  background:#fff;color:var(--navy);transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:#eef3fa}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.32)}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.savestate{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.savestate.saved{background:rgba(255,255,255,.14);color:#cfe3d4}
.savestate.unsaved{background:#ffd8a8;color:#7a4a00}

.chips{max-width:1240px;margin:0 auto;padding:0 20px 10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;gap:7px;align-items:baseline;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 12px;font-size:12.5px;color:#e6eef8}
.chip strong{font-size:13.5px}
.chip.ok strong{color:#a8e6bf}.chip.warn strong{color:#ffd89a}.chip.bad strong{color:#ffb3ac}
.chip-l{color:#b9c8de}

/* ---------- tabs ---------- */
.tabs{background:var(--blue);position:sticky;top:0;z-index:55}
.tabs-in{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;color:#d8e5f3;padding:11px 15px;font-size:13.5px;font-weight:550;
  border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.tab.active{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.1)}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card h2{font-size:17px;color:var(--navy)}
.card .sub{font-size:13px;color:var(--muted);margin-top:3px}
.sticky-head{position:sticky;top:44px;z-index:40}
.group{padding:0;overflow:hidden}
.group-title{font-size:13px;font-weight:650;color:#fff;background:var(--blue);padding:9px 16px;letter-spacing:.01em}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;min-width:0}
.field input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.field.small>span{font-size:10.5px}
.field.small input{padding:5px 8px;font-size:13px}
.field.grow{flex:1 1 200px}
.warn-input{border-color:#e0a63c!important;background:#fffaf0}

.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.search{flex:1 1 240px;border:1px solid var(--line);border-radius:7px;padding:7px 11px}
.search:focus{outline:2px solid var(--blue);outline-offset:-1px}
.segmented{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg-btn{border:0;background:#fff;padding:7px 13px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg-btn:last-child{border-right:0}
.seg-btn.on{background:var(--navy);color:#fff;font-weight:600}
.seg-btn:hover:not(.on){background:var(--light)}

/* ---------- progress ---------- */
.big-pct{font-size:38px;font-weight:700;color:var(--navy);line-height:1.1;margin:10px 0 6px}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--na-bg);margin:10px 0}
.seg{height:100%}
.seg-complete{background:var(--ok)}
.seg-pending{background:#e0a63c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{display:flex;flex-direction:column;background:var(--band);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat strong{font-size:19px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);margin-top:2px}
.inline-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;align-items:center}
.inline-stats strong{color:var(--ink);font-size:14px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--na)}
.ready{border-radius:8px;padding:9px 12px;font-weight:650;font-size:13.5px;text-align:center;margin-bottom:12px}
.ready-yes{background:var(--ok-bg);color:var(--ok)}
.ready-no{background:var(--bad-bg);color:var(--bad)}
.ready-inline{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.ready-inline.ready-yes{background:var(--ok-bg);color:var(--ok)}
.ready-inline.ready-no{background:var(--bad-bg);color:var(--bad)}
.btn-quiet{border-color:var(--line);width:100%;color:var(--blue)}

/* ---------- items ---------- */
.item{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.group .item:first-of-type{border-top:0}
.item.s-complete{background:linear-gradient(90deg,var(--ok-bg) 0 3px,#fff 3px)}
.item.s-pending{background:linear-gradient(90deg,#e0a63c 0 3px,#fff 3px)}
.item.s-todo{background:linear-gradient(90deg,var(--bad) 0 3px,#fff 3px)}
.item.s-na{background:linear-gradient(90deg,var(--na) 0 3px,#fafbfc 3px);opacity:.72}
.item.v-attended{background:linear-gradient(90deg,var(--ok) 0 3px,#fff 3px)}
.item.v-overdue{background:linear-gradient(90deg,var(--bad) 0 3px,#fff 3px)}
.item.v-due{background:linear-gradient(90deg,#e0a63c 0 3px,#fff 3px)}
.item.v-scheduled,.item.v-unset{background:#fff}
.item.is-gate .item-title{font-weight:650;color:var(--navy)}
.item-main{min-width:0}
.item-title{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.item-meta{display:flex;gap:10px;align-items:center;margin-top:5px;flex-wrap:wrap}
.item-ctl{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end}
.item-extra{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.dates{display:flex;gap:8px}
.tests{font-size:12.5px;color:var(--muted);margin-top:6px;max-width:70ch}
.ref{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--band);
  border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.due{font-size:12px;color:var(--muted)}
.gate-pill{background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;
  border-radius:4px;padding:2px 6px}
.na{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--muted);padding-bottom:6px;white-space:nowrap}
.na input{width:15px;height:15px}
.btn-tick{border-color:var(--line);background:#fff;color:var(--ok);min-width:118px}
.btn-tick.on{background:var(--ok);border-color:var(--ok);color:#fff}

.badge{font-size:11px;font-weight:650;border-radius:20px;padding:2px 9px;white-space:nowrap}
.b-complete,.b-attended{background:var(--ok-bg);color:var(--ok)}
.b-pending,.b-due{background:var(--warn-bg);color:var(--warn)}
.b-todo,.b-overdue{background:var(--bad-bg);color:var(--bad)}
.b-na,.b-scheduled,.b-unset{background:var(--na-bg);color:var(--na)}

/* ---------- misc ---------- */
.gate-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.gate-list li{display:flex;gap:9px;align-items:baseline;font-size:13.5px;padding:8px 11px;
  background:var(--bad-bg);border-radius:7px}
.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap}
.tag-d{background:#dbe7f6;color:#1b4a80}
.tag-r{background:#e6e0f5;color:#4a327d}
.ok-note{margin-top:12px;background:var(--ok-bg);color:var(--ok);padding:10px 12px;border-radius:8px;font-weight:600;font-size:13.5px}
.muted-note{margin-top:12px;color:var(--muted);font-size:13.5px}
table.grid{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
table.grid th{text-align:left;background:var(--band);color:var(--muted);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.04em;padding:7px 10px;border-bottom:1px solid var(--line)}
table.grid td{padding:8px 10px;border-bottom:1px solid var(--line)}
dl.help{margin:14px 0 0}
dl.help dt{font-weight:650;color:var(--navy);font-size:13.5px;margin-top:14px}
dl.help dd{margin:4px 0 0;color:var(--ink);font-size:13.5px;max-width:80ch}
.keygrid{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:9px;font-size:13.5px;opacity:0;transition:.25s;z-index:200;box-shadow:0 6px 24px rgba(0,0,0,.22)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}

/* ---------- registry / cloud ---------- */
.cloud-pill{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.cloud-pill.on{background:rgba(255,255,255,.14);color:#cfe3d4}
.cloud-pill.off{background:#ffd8a8;color:#7a4a00}
.cloud-pill.busy{background:rgba(255,255,255,.14);color:#e6eef8}
.reg-hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:var(--radius);
  padding:24px 26px;box-shadow:var(--shadow)}
.reg-hero h2{color:#fff;font-size:20px}
.reg-hero p{color:#dbe6f4;margin-top:5px;font-size:13.5px;max-width:70ch}
.case-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.case-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.case-row:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(30,60,100,.08)}
.case-row .who{display:flex;flex-direction:column;gap:2px}
.case-row .who b{font-size:14px;color:var(--ink)}
.case-row .who span{font-size:12px;color:var(--muted)}
.case-row .mrns{font-size:12px;color:var(--muted);text-align:right}
.case-row .upd{font-size:11px;color:var(--na);white-space:nowrap}
.empty-state{padding:20px;text-align:center;color:var(--muted);font-size:13.5px}
.patient-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.patient-head h2{font-size:19px}
.sheet-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.sheet-tile{border:1px solid var(--line);background:#fff;border-radius:9px;padding:14px 14px;text-align:left}
.sheet-tile:hover{border-color:var(--blue);background:var(--light)}
.sheet-tile b{display:block;font-size:14px;color:var(--navy);margin-bottom:4px}
.sheet-tile span{font-size:12px;color:var(--muted)}
.sheet-tile .pct{float:right;font-weight:700;color:var(--navy)}
@media(max-width:900px){.sheet-tiles{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.sheet-tiles{grid-template-columns:1fr}}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h2{font-size:17px;color:var(--navy)}
.modal .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.modal .form-grid{grid-template-columns:1fr}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pending-toggle{border:1px solid var(--line);background:#fff;color:var(--warn);border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;min-width:96px}
.pending-toggle.on{background:var(--warn-bg);border-color:#e0a63c}
.reminder-preview{background:var(--band);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;max-height:220px;overflow:auto;white-space:pre-wrap}

@media(max-width:900px){
  .two-col{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr 1fr}
  .item{grid-template-columns:1fr}
  .item-ctl{justify-content:flex-start}
  .sticky-head{position:static}
}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}

/* ---------- print ---------- */
@media print{
  body{background:#fff}
  .appbar,.tabs,.toolbar,.btn,.na input,.toast,.chips{display:none!important}
  main{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:0 0 10px;break-inside:auto}
  .sticky-head{position:static}
  .item{break-inside:avoid;padding:6px 0;border-top:1px solid #ccc}
  .group-title{background:#eee!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .badge,.ready,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .field input{border:0;border-bottom:1px solid #999;border-radius:0}
  #printAll{display:block!important}
}

</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand">
      <strong>Transplant Coordinator Tracker</strong>
      <span>An-Najah National University Hospital &middot; Kidney Transplant Program &middot; Manual v2.1</span>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="btnHome">&#8962; Registry</button>
      <span id="saveState" class="cloud-pill off">Cloud not configured</span>
      <button class="btn" id="btnCloudSave">Save to cloud</button>
      <button class="btn btn-ghost" id="btnExportSheet">Export to Google Sheet</button>
      <button class="btn btn-ghost" id="btnRemind">Email reminder</button>
      <button class="btn btn-ghost" id="btnCsv">Export CSV</button>
      <button class="btn btn-ghost" id="btnPrint">Print</button>
      <button class="btn btn-ghost" id="btnSettings">Settings</button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden>
    </div>
  </div>
  <div class="chips" id="headerChips"></div>
</header>

<nav class="tabs">
  <div class="tabs-in">
      <button class="tab" data-tab="overview">Overview</button>
      <button class="tab" data-tab="donor">Donor checklist</button>
      <button class="tab" data-tab="recipient">Recipient checklist</button>
      <button class="tab" data-tab="rfu">Recipient follow-up</button>
      <button class="tab" data-tab="dfu">Donor follow-up</button>
      <button class="tab" data-tab="help">How to use</button>
  </div>
</nav>

<main id="app"></main>
<div id="modalRoot"></div>

eck"},{"key":"dv9","label":"Year 5","offset":1826,"grace":60,"tests":"Annual health check"},{"key":"dv10","label":"Year 6","offset":2191,"grace":60,"tests":"Annual health check"},{"key":"dv11","label":"Year 7","offset":2556,"grace":60,"tests":"Annual health check"},{"key":"dv12","label":"Year 8","offset":2922,"grace":60,"tests":"Annual health check"},{"key":"dv13","label":"Year 9","offset":3287,"grace":60,"tests":"Annual health check"},{"key":"dv14","label":"Year 10","offset":3652,"grace":60,"tests":"Annual health check"},{"key":"dv15","label":"Year 11","offset":4017,"grace":60,"tests":"Annual health check"},{"key":"dv16","label":"Year 12","offset":4383,"grace":60,"tests":"Annual health check"},{"key":"dv17","label":"Year 13","offset":4748,"grace":60,"tests":"Annual health check"},{"key":"dv18","label":"Year 14","offset":5113,"grace":60,"tests":"Annual health check"},{"key":"dv19","label":"Year 15","offset":5478,"grace":60,"tests":"Annual health check — follow-up continues for life"}],"recipCols":["Creatinine / eGFR","Tacrolimus trough"],"donorCols":["Creatinine / eGFR","UPCR","Blood pressure","Weight"]};

<script>
/* ==========================================================================
   NNUH Kidney Transplant — Coordinator Tracker (client-side application)
   State lives in memory. Persistence is by explicit case-file save/load.
   ========================================================================== */
'use strict';

const DATA = window.__DATA__;
const TODAY = () => new Date(new Date().toDateString());
const iso = (d) => {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const parseISO = (s) => (s ? new Date(s + 'T00:00:00') : null);
const addDays = (d, n) => new Date(d.getTime() + n * 86400000);
const fmt = (s) => {
  const d = parseISO(s);
  if (!d) return '';
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
};
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach((c) => { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
};

/* ---------------------------------------------------------------- state */
const blankState = () => ({
  meta: {
    version: 1,
    caseId: '',
    donorName: '', donorMrn: '', donorDob: '',
    recipientName: '', recipientMrn: '', recipientDob: '',
    coordinator: '', opened: iso(TODAY()),
    caseStatus: 'waiting', scheduledDate: '',
    transplantDate: '', nephrectomyDate: '',
    email: '', savedAt: '',
  },
  // key -> {na, ordered, completed, result, notes}
  items: {},
  // key -> {attended, notes, values:{}}
  visits: {},
});

let S = blankState();
let dirty = false;
let hasCase = false;
let activeTab = 'registry';
const filters = { donor: 'all', recipient: 'all' };
const search = { donor: '', recipient: '' };

/* ---------------------------------------------------------- cloud config */
const CFG_KEY = 'nnuh_tracker_cfg_v1';
const loadCfg = () => {
  try { return Object.assign({ gasUrl: '', emailjsService: '', emailjsTemplate: '', emailjsPublicKey: '', viewPassword: '', casePassword: '', settingsPassword: '' }, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); }
  catch { return { gasUrl: '', emailjsService: '', emailjsTemplate: '', emailjsPublicKey: '', viewPassword: '', casePassword: '', settingsPassword: '' }; }
};
let CFG = loadCfg();
const saveCfg = () => { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); syncCloudPill(); };
const cloudReady = () => !!CFG.gasUrl;

let registryCache = [];
let registryQuery = '';
let registryLoading = false;
let registryView = 'home'; // 'home' | 'register' | 'browse'
let registryUnlocked = false;
let caseUnlocked = false;
let settingsUnlocked = false;
let browseWho = 'donor'; // 'donor' | 'recipient'
let statusFilter = 'all'; // 'all' | 'waiting' | 'scheduled' | 'transplanted'
let dateFrom = '';
let dateTo = '';

const CASE_STATUS = {
  waiting: { label: 'On waiting list', badge: 'b-todo' },
  scheduled: { label: 'Scheduled', badge: 'b-due' },
  transplanted: { label: 'Transplanted', badge: 'b-complete' },
};

const markDirty = () => {
  dirty = true;
  syncCloudPill();
};
const markClean = () => {
  dirty = false;
  syncCloudPill();
};
function syncCloudPill(state) {
  const b = document.getElementById('saveState');
  if (!b) return;
  if (!cloudReady()) { b.textContent = 'Cloud not configured'; b.className = 'cloud-pill off'; return; }
  if (state === 'busy') { b.textContent = 'Syncing…'; b.className = 'cloud-pill busy'; return; }
  if (state === 'error') { b.textContent = 'Sync failed'; b.className = 'cloud-pill off'; return; }
  b.textContent = dirty ? 'Unsaved changes' : 'Synced to Google Sheet';
  b.className = 'cloud-pill ' + (dirty ? 'off' : 'on');
}

const itemState = (key) => (S.items[key] ||= { na: false, ordered: '', completed: '', result: '', notes: '' });
const visitState = (key) => (S.visits[key] ||= { attended: '', notes: '', values: {} });

const statusOf = (st) => {
  if (st.na) return 'na';
  if (st.completed) return 'complete';
  if (st.ordered) return 'pending';
  return 'todo';
};
const STATUS_LABEL = { complete: 'Complete', pending: 'Pending result', todo: 'Not started', na: 'N/A' };

/* --------------------------------------------------------------- totals */
function tally(list) {
  const t = { complete: 0, pending: 0, todo: 0, na: 0, gatesOpen: [], total: 0 };
  list.forEach((it) => {
    if (it.group) return;
    const st = itemState(it.key);
    const s = statusOf(st);
    t[s] += 1;
    if (s !== 'na') t.total += 1;
    if (it.gate && s !== 'complete' && s !== 'na') t.gatesOpen.push(it);
  });
  t.outstanding = t.pending + t.todo;
  t.pct = t.total ? Math.round((t.complete / t.total) * 100) : 0;
  t.ready = t.total > 0 && t.outstanding === 0;
  return t;
}

/* ---------------------------------------------------------- visit logic */
function visitStatus(v, anchorISO) {
  const st = visitState(v.key);
  if (st.attended) return { code: 'attended', label: 'Attended', due: dueOf(v, anchorISO) };
  const due = dueOf(v, anchorISO);
  if (!due) return { code: 'unset', label: 'Set the date', due: null };
  const t = TODAY();
  if (t > addDays(due, v.grace)) return { code: 'overdue', label: 'OVERDUE', due };
  if (t >= addDays(due, -v.grace)) return { code: 'due', label: 'Due now', due };
  return { code: 'scheduled', label: 'Scheduled', due };
}
function dueOf(v, anchorISO) {
  const a = parseISO(anchorISO);
  return a ? addDays(a, v.offset) : null;
}

/* =========================================================== RENDERING */
const app = () => document.getElementById('app');

function render() {
  const root = app();
  root.innerHTML = '';
  const tabsNav = document.querySelector('.tabs');
  const showTabs = activeTab !== 'registry';
  tabsNav.style.display = showTabs ? '' : 'none';
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === activeTab));
  const gated = ['overview', 'donor', 'recipient', 'rfu', 'dfu'].includes(activeTab) && CFG.casePassword && !caseUnlocked;
  if (gated) { root.appendChild(renderCaseGate()); updateHeaderChips(); syncCloudPill(); return; }
  if (activeTab === 'registry') root.appendChild(renderRegistry());
  else if (activeTab === 'overview') root.appendChild(renderOverview());
  else if (activeTab === 'donor') root.appendChild(renderChecklist('donor'));
  else if (activeTab === 'recipient') root.appendChild(renderChecklist('recipient'));
  else if (activeTab === 'rfu') root.appendChild(renderFollowUp('rfu'));
  else if (activeTab === 'dfu') root.appendChild(renderFollowUp('dfu'));
  else if (activeTab === 'help') root.appendChild(renderHelp());
  updateHeaderChips();
  syncCloudPill();
}

function updateHeaderChips() {
  const d = tally(DATA.donor), r = tally(DATA.recipient);
  const c = document.getElementById('headerChips');
  c.innerHTML = '';
  c.appendChild(chip('Donor', `${d.complete}/${d.total}`, d.ready ? 'ok' : d.outstanding ? 'warn' : 'muted'));
  c.appendChild(chip('Recipient', `${r.complete}/${r.total}`, r.ready ? 'ok' : r.outstanding ? 'warn' : 'muted'));
  const od = overdueCount();
  c.appendChild(chip('Overdue visits', String(od), od ? 'bad' : 'ok'));
}
function chip(label, value, tone) {
  return el('div', { class: 'chip ' + tone }, [el('span', { class: 'chip-l', text: label }), el('strong', { text: value })]);
}
function overdueCount() {
  let n = 0;
  DATA.recipVisits.forEach((v) => { if (!v.section && visitStatus(v, S.meta.transplantDate).code === 'overdue') n++; });
  DATA.donorVisits.forEach((v) => { if (!v.section && visitStatus(v, S.meta.nephrectomyDate).code === 'overdue') n++; });
  return n;
}

function renderCaseGate() {
  const wrap = el('div', { class: 'stack' });
  const lock = card('Enter password to view this case', `Password required to open ${S.meta.recipientName || S.meta.donorName || 'this case'}\u2019s checklists and overview.`);
  const row = el('div', { class: 'toolbar' });
  const pwInput = el('input', { type: 'password', class: 'search', placeholder: 'Password' });
  const go = () => {
    if (pwInput.value === CFG.casePassword) { caseUnlocked = true; render(); }
    else toast('Incorrect password.', true);
  };
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  const btn = el('button', { class: 'btn', text: 'Unlock' });
  btn.addEventListener('click', go);
  row.append(pwInput, btn);
  lock.appendChild(row);
  const back = el('button', { class: 'btn btn-ghost', text: '\u2190 Back to registry', style: 'margin-top:10px' });
  back.addEventListener('click', () => { activeTab = 'registry'; registryView = 'home'; render(); });
  lock.appendChild(back);
  wrap.appendChild(lock);
  return wrap;
}

/* ------------------------------------------------------------ registry */
function renderRegistry() {
  const wrap = el('div', { class: 'stack' });

  const hero = el('section', { class: 'reg-hero' });
  hero.appendChild(el('h2', { text: 'NNUH Kidney Transplant Program — Patient Registry' }));
  hero.appendChild(el('p', { text: 'Register a new donor–recipient pair, or view the donor and recipient list (password protected).' }));
  wrap.appendChild(hero);

  if (!cloudReady()) {
    const warn = card('Cloud not configured', null);
    warn.appendChild(el('p', { class: 'muted-note', text: 'Add your Google Apps Script URL in Settings to enable the shared registry, cloud save, Google Sheet export and email reminders.' }));
    const b = el('button', { class: 'btn', text: 'Open Settings' });
    b.addEventListener('click', openSettings);
    warn.appendChild(b);
    wrap.appendChild(warn);
  }

  if (registryView === 'home') { wrap.appendChild(renderRegistryHome()); return wrap; }
  if (registryView === 'register') { wrap.appendChild(renderRegisterForm()); return wrap; }
  wrap.appendChild(renderRegistryBrowse());
  return wrap;
}

function renderRegistryHome() {
  const box = el('div', { class: 'sheet-tiles', style: 'grid-template-columns:1fr 1fr' });
  const regTile = el('button', { class: 'sheet-tile' }, [
    el('b', { text: 'Register' }),
    el('span', { text: 'Register a new donor \u2013 recipient pair and open its checklists.' }),
  ]);
  regTile.addEventListener('click', () => { registryView = 'register'; render(); });
  const viewTile = el('button', { class: 'sheet-tile' }, [
    el('b', { text: 'View donors & recipients' }),
    el('span', { text: 'Password-protected list of everyone registered, with search and date filter.' }),
  ]);
  viewTile.addEventListener('click', () => { registryView = 'browse'; render(); });
  box.append(regTile, viewTile);
  return box;
}

function renderRegisterForm() {
  const wrap = el('div', { class: 'stack' });
  const back = el('button', { class: 'btn btn-ghost', text: '\u2190 Back' });
  back.addEventListener('click', () => { registryView = 'home'; render(); });
  wrap.appendChild(back);

  const regCard = card('Register a new donor \u2013 recipient pair', 'Creates a new case and opens its checklists.');
  const grid = el('div', { class: 'form-grid' });
  const tmp = { donorName: '', donorMrn: '', recipientName: '', recipientMrn: '', coordinator: '', email: '',
    caseStatus: 'waiting', scheduledDate: '', transplantDate: '' };
  const f = (label, key, type = 'text') => {
    const input = el('input', { type });
    input.addEventListener('input', (e) => { tmp[key] = e.target.value; });
    return el('label', { class: 'field' }, [el('span', { text: label }), input]);
  };
  grid.append(
    f('Donor name', 'donorName'), f('Donor MRN', 'donorMrn'),
    f('Recipient name', 'recipientName'), f('Recipient MRN', 'recipientMrn'),
    f('Transplant coordinator', 'coordinator'), f('Reminder email', 'email', 'email'),
  );
  regCard.appendChild(grid);

  const statusRow = el('div', { class: 'form-grid' });
  const statusSel = el('select');
  Object.keys(CASE_STATUS).forEach((k) => statusSel.appendChild(el('option', { value: k, text: CASE_STATUS[k].label })));
  statusSel.value = tmp.caseStatus;
  const dateWrap = el('div');
  const renderStatusDate = () => {
    dateWrap.innerHTML = '';
    if (tmp.caseStatus === 'scheduled') {
      const i = el('input', { type: 'date', value: tmp.scheduledDate });
      i.addEventListener('change', (e) => { tmp.scheduledDate = e.target.value; });
      dateWrap.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Scheduled transplant date' }), i]));
    } else if (tmp.caseStatus === 'transplanted') {
      const i = el('input', { type: 'date', value: tmp.transplantDate });
      i.addEventListener('change', (e) => { tmp.transplantDate = e.target.value; });
      dateWrap.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Date of transplant' }), i]));
    }
  };
  statusSel.addEventListener('change', (e) => { tmp.caseStatus = e.target.value; renderStatusDate(); });
  statusRow.append(el('label', { class: 'field' }, [el('span', { text: 'Status' }), statusSel]), dateWrap);
  renderStatusDate();
  regCard.appendChild(statusRow);

  const regBtn = el('button', { class: 'btn', text: 'Register and open', style: 'margin-top:14px' });
  regBtn.addEventListener('click', async () => {
    if (!tmp.recipientName && !tmp.donorName) { toast('Enter at least a donor or recipient name.', true); return; }
    if (dirty && hasCase && !confirm('Discard the currently open case and register a new one?')) return;
    S = blankState();
    Object.assign(S.meta, tmp);
    S.meta.caseId = genCaseId();
    hasCase = true;
    if (cloudReady()) { await cloudSave(true); toast('Case registered.'); }
    else toast('Case started (not saved to cloud \u2014 add a Google Apps Script URL in Settings).');
    registryView = 'home';
    activeTab = 'overview';
    render();
  });
  regCard.appendChild(regBtn);
  wrap.appendChild(regCard);
  return wrap;
}

function renderRegistryBrowse() {
  const wrap = el('div', { class: 'stack' });
  const back = el('button', { class: 'btn btn-ghost', text: '\u2190 Back' });
  back.addEventListener('click', () => { registryView = 'home'; registryUnlocked = false; render(); });
  wrap.appendChild(back);

  if (CFG.viewPassword && !registryUnlocked) {
    const lock = card('Enter password to view the list', 'This list holds every registered donor and recipient.');
    const row = el('div', { class: 'toolbar' });
    const pwInput = el('input', { type: 'password', class: 'search', placeholder: 'Password' });
    const go = () => {
      if (pwInput.value === CFG.viewPassword) { registryUnlocked = true; render(); }
      else toast('Incorrect password.', true);
    };
    pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    const btn = el('button', { class: 'btn', text: 'Unlock' });
    btn.addEventListener('click', go);
    row.append(pwInput, btn);
    lock.appendChild(row);
    wrap.appendChild(lock);
    return wrap;
  }

  // sub-tabs: donor / recipient
  const subTabs = el('div', { class: 'segmented' });
  [['donor', 'Donors'], ['recipient', 'Recipients']].forEach(([k, lbl]) => {
    const b = el('button', { class: 'seg-btn' + (browseWho === k ? ' on' : ''), text: lbl });
    b.addEventListener('click', () => { browseWho = k; render(); });
    subTabs.appendChild(b);
  });
  wrap.appendChild(subTabs);

  // search + status + date filter
  const listCard = card('Registered ' + (browseWho === 'donor' ? 'donors' : 'recipients'), 'Search by name or MRN, filter by status or the date the case was opened, then click a row to open it.');
  const tools = el('div', { class: 'toolbar' });
  const sInput = el('input', { type: 'search', class: 'search', placeholder: 'Search name or MRN\u2026', value: registryQuery });
  let debounceT;
  sInput.addEventListener('input', (e) => {
    registryQuery = e.target.value;
    clearTimeout(debounceT);
    debounceT = setTimeout(loadRegistryList, 250);
  });
  tools.appendChild(sInput);
  const statusGroup = el('div', { class: 'segmented' });
  [['all', 'All'], ['waiting', 'Waiting list'], ['scheduled', 'Scheduled'], ['transplanted', 'Transplanted']].forEach(([k, lbl]) => {
    const b = el('button', { class: 'seg-btn' + (statusFilter === k ? ' on' : ''), text: lbl });
    b.addEventListener('click', () => { statusFilter = k; render(); });
    statusGroup.appendChild(b);
  });
  tools.appendChild(statusGroup);
  const fromF = el('label', { class: 'field small' }, [el('span', { text: 'Opened from' }),
    (() => { const i = el('input', { type: 'date', value: dateFrom }); i.addEventListener('change', (e) => { dateFrom = e.target.value; paintList(); }); return i; })()]);
  const toF = el('label', { class: 'field small' }, [el('span', { text: 'Opened to' }),
    (() => { const i = el('input', { type: 'date', value: dateTo }); i.addEventListener('change', (e) => { dateTo = e.target.value; paintList(); }); return i; })()]);
  tools.append(fromF, toF);
  if (dateFrom || dateTo) {
    const clr = el('button', { class: 'btn btn-ghost', text: 'Clear dates' });
    clr.addEventListener('click', () => { dateFrom = ''; dateTo = ''; render(); });
    tools.appendChild(clr);
  }
  listCard.appendChild(tools);
  const listBox = el('div', { class: 'case-list', id: 'caseListBox' });
  listCard.appendChild(listBox);
  wrap.appendChild(listCard);

  function filteredCases() {
    return registryCache.filter((c) => {
      const opened = (c.opened || '').slice(0, 10);
      if (dateFrom && (!opened || opened < dateFrom)) return false;
      if (dateTo && (!opened || opened > dateTo)) return false;
      const st = c.caseStatus || 'waiting';
      if (statusFilter !== 'all' && st !== statusFilter) return false;
      return true;
    });
  }
  function paintList() {
    listBox.innerHTML = '';
    if (!cloudReady()) { listBox.appendChild(el('div', { class: 'empty-state', text: 'Configure the cloud connection to browse registered patients.' })); return; }
    if (registryLoading) { listBox.appendChild(el('div', { class: 'empty-state', text: 'Loading\u2026' })); return; }
    const rows = filteredCases();
    if (!rows.length) { listBox.appendChild(el('div', { class: 'empty-state', text: 'No registered pairs match yet.' })); return; }
    rows.forEach((c) => {
      const st = CASE_STATUS[c.caseStatus || 'waiting'];
      const name = browseWho === 'donor' ? (c.donorName || 'Unnamed donor') : (c.recipientName || 'Unnamed recipient');
      const mrn = browseWho === 'donor' ? c.donorMrn : c.recipientMrn;
      const other = browseWho === 'donor' ? (c.recipientName || 'Unnamed recipient') : (c.donorName || 'Unnamed donor');
      const row = el('div', { class: 'case-row', style: 'grid-template-columns:1fr auto auto auto' });
      row.appendChild(el('div', { class: 'who' }, [
        el('b', { text: name }),
        el('span', { text: `${browseWho === 'donor' ? 'Recipient' : 'Donor'}: ${other}` }),
      ]));
      row.appendChild(el('div', { class: 'mrns', text: `MRN ${mrn || '\u2014'}` }));
      row.appendChild(badge(st.badge.replace('b-', ''), st.label));
      const dateText = c.caseStatus === 'transplanted' && c.transplantDate ? 'Transplanted ' + fmt(c.transplantDate)
        : c.caseStatus === 'scheduled' && c.scheduledDate ? 'Scheduled ' + fmt(c.scheduledDate)
        : c.opened ? 'Opened ' + fmt(c.opened.slice(0, 10)) : '';
      row.appendChild(el('div', { class: 'upd', text: dateText }));
      row.addEventListener('click', () => {
        if (dirty && hasCase && !confirm('Discard unsaved changes on the current case and open this one?')) return;
        openCase(c.caseId);
      });
      listBox.appendChild(row);
    });
  }
  async function loadRegistryList() {
    if (!cloudReady()) { paintList(); return; }
    registryLoading = true; paintList();
    try { registryCache = await gasListCases(registryQuery); }
    catch (e) { toast('Could not load the registry \u2014 ' + e.message, true); registryCache = []; }
    registryLoading = false; paintList();
  }
  loadRegistryList();

  return wrap;
}

  grid.append(
    f('Case reference', 'caseId'),
    f('Transplant coordinator', 'coordinator'),
    f('Date file opened', 'opened', 'date'),
    f('Donor name', 'donorName'),
    f('Donor MRN', 'donorMrn'),
    f('Donor date of birth', 'donorDob', 'date'),
    f('Recipient name', 'recipientName'),
    f('Recipient MRN', 'recipientMrn'),
    f('Recipient date of birth', 'recipientDob', 'date'),
    f('Date of transplant', 'transplantDate', 'date'),
    f('Date of donor nephrectomy', 'nephrectomyDate', 'date'),

const pc = (n, d) => (d ? (n / d) * 100 : 0);

/* ----------------------------------------------------------- checklist */
function renderChecklist(which) {
  const list = which === 'donor' ? DATA.donor : DATA.recipient;
  const t = tally(list);
  const wrap = el('div', { class: 'stack' });

  const head = el('section', { class: 'card sticky-head' });
  head.appendChild(el('h2', { text: which === 'donor' ? 'Living kidney donor — evaluation & perioperative checklist' : 'Kidney transplant recipient — evaluation & perioperative checklist' }));
  head.appendChild(el('p', { class: 'sub', text: which === 'donor' ? 'Program Manual v2.1, Guidelines 1–3' : 'Program Manual v2.1, Guideline 4' }));

  const bar = el('div', { class: 'bar' }, [
    el('div', { class: 'seg seg-complete', style: `width:${pc(t.complete, t.total)}%` }),
    el('div', { class: 'seg seg-pending', style: `width:${pc(t.pending, t.total)}%` }),
  ]);
  head.appendChild(bar);
  head.appendChild(el('div', { class: 'inline-stats' }, [
    el('span', {}, [el('strong', { text: `${t.complete}/${t.total}` }), ' complete']),
    el('span', {}, [el('strong', { class: 'warn', text: String(t.pending) }), ' pending']),
    el('span', {}, [el('strong', { class: 'bad', text: String(t.todo) }), ' not started']),
    el('span', {}, [el('strong', { class: 'muted', text: String(t.na) }), ' N/A']),
    el('span', { class: 'ready-inline ' + (t.ready ? 'ready-yes' : 'ready-no'), text: t.ready ? 'READY' : 'NOT READY' }),
  ]));

  const tools = el('div', { class: 'toolbar' });
  const sInput = el('input', { type: 'search', placeholder: 'Search items…', value: search[which], class: 'search' });
  sInput.addEventListener('input', (e) => { search[which] = e.target.value.toLowerCase(); renderRows(); });
  tools.appendChild(sInput);
  const fgroup = el('div', { class: 'segmented' });
  [['all', 'All'], ['outstanding', 'Outstanding'], ['gates', 'Gates'], ['complete', 'Complete']].forEach(([k, lbl]) => {
    const b = el('button', { class: 'seg-btn' + (filters[which] === k ? ' on' : ''), text: lbl });
    b.addEventListener('click', () => { filters[which] = k; render(); });
    fgroup.appendChild(b);
  });
  tools.appendChild(fgroup);
  head.appendChild(tools);
  wrap.appendChild(head);

  const body = el('div', { id: 'rows' });
  wrap.appendChild(body);

  function renderRows() {
    body.innerHTML = '';
    const q = search[which];
    const mode = filters[which];
    let currentGroup = null, groupBox = null, shown = 0;
    list.forEach((it) => {
      if (it.group) { currentGroup = it.group; groupBox = null; return; }
      const st = itemState(it.key);
      const s = statusOf(st);
      if (mode === 'outstanding' && (s === 'complete' || s === 'na')) return;
      if (mode === 'complete' && s !== 'complete') return;
      if (mode === 'gates' && !it.gate) return;
      if (q && !(it.text.toLowerCase().includes(q) || it.ref.toLowerCase().includes(q) || currentGroup.toLowerCase().includes(q))) return;
      if (!groupBox) {
        groupBox = el('section', { class: 'card group' });
        groupBox.appendChild(el('h3', { class: 'group-title', text: currentGroup }));
        body.appendChild(groupBox);
      }
      groupBox.appendChild(itemRow(it, which));
      shown += 1;
    });
    if (!shown) body.appendChild(el('section', { class: 'card' }, el('p', { class: 'muted-note', text: 'No items match the current filter.' })));
  }
  renderRows();
  return wrap;
}

function itemRow(it, which) {
  const st = itemState(it.key);
  const s = statusOf(st);
  const row = el('div', { class: 'item s-' + s + (it.gate ? ' is-gate' : '') });

  const main = el('div', { class: 'item-main' });
  const title = el('div', { class: 'item-title' });
  if (it.gate) title.appendChild(el('span', { class: 'gate-pill', text: 'GATE' }));
  title.appendChild(el('span', { text: it.text.replace(/^GATE — /, '') }));
  main.appendChild(title);
  main.appendChild(el('div', { class: 'item-meta' }, [
    el('span', { class: 'ref', text: '§' + it.ref }),
    badge(s, STATUS_LABEL[s]),
  ]));
  row.appendChild(main);

  const ctl = el('div', { class: 'item-ctl' });

  const done = el('button', { class: 'btn btn-tick' + (s === 'complete' ? ' on' : ''), title: 'Mark complete with today\'s date' , text: s === 'complete' ? '✓ Complete' : '✓ Done' });
  done.addEventListener('click', () => {
    if (st.completed) { st.completed = ''; } else { st.completed = iso(TODAY()); st.na = false; if (!st.ordered) st.ordered = st.completed; }
    markDirty(); render();
  });
  ctl.appendChild(done);

  const pend = el('button', { class: 'pending-toggle' + (s === 'pending' ? ' on' : ''), title: 'Mark as ordered / pending result', text: s === 'pending' ? '\u23f3 Pending' : 'Mark pending' });
  pend.addEventListener('click', () => {
    if (st.ordered && !st.completed) { st.ordered = ''; } else { st.ordered = iso(TODAY()); st.na = false; }
    markDirty(); render();
  });
  ctl.appendChild(pend);

  const dates = el('div', { class: 'dates' });
  dates.append(
    dateField('Ordered', st, 'ordered'),
    dateField('Completed', st, 'completed'),
  );
  ctl.appendChild(dates);

  const na = el('label', { class: 'na' }, [
    (() => {
      const cb = el('input', { type: 'checkbox' });
      cb.checked = !!st.na;
      cb.addEventListener('change', (e) => { st.na = e.target.checked; if (st.na) { st.ordered = ''; st.completed = ''; } markDirty(); render(); });
      return cb;
    })(),
    el('span', { text: 'N/A' }),
  ]);
  ctl.appendChild(na);
  row.appendChild(ctl);

  const extra = el('div', { class: 'item-extra' });
  const resultField = textField('Lab value / result', st, 'result');
  const resultInput = resultField.querySelector('input');
  resultInput.addEventListener('input', () => {
    if (resultInput.value.trim() && !st.completed) { st.completed = iso(TODAY()); if (!st.ordered) st.ordered = st.completed; }
    if (!resultInput.value.trim() && st.completed) { st.completed = ''; }
  });
  resultInput.addEventListener('blur', () => { markDirty(); render(); });
  extra.append(
    resultField,
    textField(st.na ? 'Reason for N/A (required)' : 'Notes', st, 'notes', st.na && !st.notes),
  );
  row.appendChild(extra);
  return row;
}

/* ------------------------------------------------------------ cloud API */
function genCaseId() {
  const d = (S.meta.donorMrn || 'donor').trim().replace(/\s+/g, '');
  const r = (S.meta.recipientMrn || 'recip').trim().replace(/\s+/g, '');
  if (S.meta.donorMrn && S.meta.recipientMrn) return `${d}_${r}`;
  return `case_${Date.now()}`;
}
async function gasCall(method, params, body) {
  if (!cloudReady()) throw new Error('Set the Google Apps Script URL in Settings first.');
  let url = CFG.gasUrl;
  if (method === 'GET') {
    const qs = new URLSearchParams(params || {});
    url += (url.includes('?') ? '&' : '?') + qs.toString();
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }
  const res = await fetch(url, { method: 'POST', body: JSON.stringify(body) });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function gasListCases(q) {
  const data = await gasCall('GET', { action: 'list', q: q || '' });
  return data.cases || [];
}
async function gasGetCase(caseId) {
  const data = await gasCall('GET', { action: 'get', caseId });
  return data.data;
}
async function gasUpsertCase(state) {
  return gasCall('POST', null, { action: 'upsert', data: state });
}
async function gasExportSheet(caseId, rows) {
  return gasCall('POST', null, { action: 'exportSheet', caseId, rows });
}

async function cloudSave(silent) {
  if (!cloudReady()) { if (!silent) toast('Add your Google Apps Script URL in Settings first.', true); return; }
  if (!S.meta.caseId) S.meta.caseId = genCaseId();
  syncCloudPill('busy');
  try {
    await gasUpsertCase(S);
    markClean();
    if (!silent) toast('Saved to Google Sheet.');
  } catch (e) {
    syncCloudPill('error');
    if (!silent) toast('Could not save to the cloud — ' + e.message, true);
  }
}
async function openCase(caseId) {
  try {
    const data = await gasGetCase(caseId);
    S = Object.assign(blankState(), data);
    S.items = data.items || {};
    S.visits = data.visits || {};
    hasCase = true;
    markClean();
    activeTab = 'overview';
    render();
  } catch (e) {
    toast('Could not open that case — ' + e.message, true);
  }
}
function buildExportRows() {
  const rows = [['Sheet', 'Section', '#', 'Ref', 'Item', 'Status', 'Date ordered', 'Date completed', 'Result / value', 'Notes']];
  const push = (list, sheet) => {
    let g = '', n = 0;
    list.forEach((it) => {
      if (it.group) { g = it.group; return; }
      n += 1;
      const st = itemState(it.key);
      rows.push([sheet, g, n, '§' + it.ref, it.text, STATUS_LABEL[statusOf(st)], st.ordered, st.completed, st.result, st.notes]);
    });
  };
  push(DATA.donor, 'Donor checklist');
  push(DATA.recipient, 'Recipient checklist');
  const pushV = (list, anchor, sheet, cols) => {
    let g = '';
    list.forEach((v) => {
      if (v.section) { g = v.section; return; }
      const st = visitState(v.key), s = visitStatus(v, anchor);
      rows.push([sheet, g, '', 'Day ' + v.offset, v.label, s.label, s.due ? iso(s.due) : '', st.attended,
        cols.map((c) => (st.values[c] ? c + '=' + st.values[c] : '')).filter(Boolean).join('; '), st.notes]);
    });
  };
  pushV(DATA.recipVisits, S.meta.transplantDate, 'Recipient follow-up', DATA.recipCols);
  pushV(DATA.donorVisits, S.meta.nephrectomyDate, 'Donor follow-up', DATA.donorCols);
  return rows;
}
async function exportSheetClick() {
  if (!cloudReady()) { toast('Add your Google Apps Script URL in Settings first.', true); return; }
  if (!S.meta.caseId) S.meta.caseId = genCaseId();
  toast('Exporting to Google Sheet…');
  try {
    await cloudSave(true);
    const rows = buildExportRows();
    const res = await gasExportSheet(S.meta.caseId, rows);
    toast('Exported. Open the Google Sheet to view the new tab.');
    if (res.url) window.open(res.url, '_blank');
  } catch (e) {
    toast('Export failed — ' + e.message, true);
  }
}
function outstandingItems() {
  const out = [];
  const collect = (list, sheet) => {
    let g = '';
    list.forEach((it) => {
      if (it.group) { g = it.group; return; }
      const st = itemState(it.key);
      const s = statusOf(st);
      if (s === 'pending' || s === 'todo') out.push({ sheet, group: g, text: it.text, ref: it.ref, status: STATUS_LABEL[s], gate: it.gate });
    });
  };
  collect(DATA.donor, 'Donor');
  collect(DATA.recipient, 'Recipient');
  return out;
}
function reminderBody() {
  const items = outstandingItems();
  const name = `${S.meta.recipientName || 'Recipient'} / ${S.meta.donorName || 'Donor'}`;
  const lines = [`Outstanding items for ${name} (case ${S.meta.caseId || genCaseId()}):`, ''];
  items.forEach((i) => lines.push(`- [${i.sheet}] ${i.gate ? 'GATE — ' : ''}${i.text} (§${i.ref}) — ${i.status}`));
  if (!items.length) lines.push('Everything is complete.');
  return lines.join('\n');
}
async function sendReminder() {
  const items = outstandingItems();
  if (!items.length) { toast('Nothing outstanding — no reminder needed.'); return; }
  const to = S.meta.email;
  if (!to) { toast('Add the recipient/coordinator email on the Overview tab first.', true); return; }
  if (!CFG.emailjsService || !CFG.emailjsTemplate || !CFG.emailjsPublicKey) {
    toast('Add your EmailJS Service ID, Template ID and Public Key in Settings first.', true);
    return;
  }
  try {
    emailjs.init({ publicKey: CFG.emailjsPublicKey });
    await emailjs.send(CFG.emailjsService, CFG.emailjsTemplate, {
      to_email: to,
      patient_name: `${S.meta.recipientName || 'Recipient'} / ${S.meta.donorName || 'Donor'}`,
      case_id: S.meta.caseId || genCaseId(),
      outstanding_count: String(items.length),
      message: reminderBody(),
    });
    toast(`Reminder sent to ${to}.`);
  } catch (e) {
    toast('Could not send the reminder — ' + (e.text || e.message || e), true);
  }
}

/* ------------------------------------------------------- save / load */
function saveCase() {
  S.meta.savedAt = new Date().toISOString();
  const name = (S.meta.caseId || `${S.meta.donorMrn || 'donor'}-${S.meta.recipientMrn || 'recipient'}`).replace(/[^\w.-]+/g, '_');
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `transplant-case_${name}_${iso(TODAY())}.json`);
  markClean();
}
function loadCase(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const parsed = JSON.parse(fr.result);
      if (!parsed || typeof parsed !== 'object' || !parsed.meta) throw new Error('Not a tracker case file.');
      S = Object.assign(blankState(), parsed);
      S.items = parsed.items || {};
      S.visits = parsed.visits || {};
      hasCase = true;
      markClean();
      document.querySelectorAll('.modal-back').forEach((n) => n.remove());
      activeTab = 'overview';
      render();
      toast('Case file loaded.');
    } catch (e) {
      toast('Could not read that file — ' + e.message, true);
    }
  };
  fr.readAsText(file);
}
function exportCsv() {
  const rows = [['Sheet', 'Section', '#', 'Ref', 'Item', 'Status', 'Date ordered', 'Date completed', 'Result', 'Notes']];
  const push = (list, sheet) => {
    let g = '', n = 0;
    list.forEach((it) => {
      if (it.group) { g = it.group; return; }
      n += 1;
      const st = itemState(it.key);
      rows.push([sheet, g, n, '§' + it.ref, it.text, STATUS_LABEL[statusOf(st)], st.ordered, st.completed, st.result, st.notes]);
    });
  };
  push(DATA.donor, 'Donor checklist');
  push(DATA.recipient, 'Recipient checklist');
  const pushV = (list, anchor, sheet, cols) => {
    let g = '';
    list.forEach((v) => {
      if (v.section) { g = v.section; return; }
      const st = visitState(v.key), s = visitStatus(v, anchor);
      rows.push([sheet, g, '', 'Day ' + v.offset, v.label, s.label, s.due ? iso(s.due) : '', st.attended,
        cols.map((c) => (st.values[c] ? c + '=' + st.values[c] : '')).filter(Boolean).join('; '), st.notes]);
    });
  };
  pushV(DATA.recipVisits, S.meta.transplantDate, 'Recipient follow-up', DATA.recipCols);
  pushV(DATA.donorVisits, S.meta.nephrectomyDate, 'Donor follow-up', DATA.donorCols);
  const csv = rows.map((r) => r.map((c) => {
    const v = c === undefined || c === null ? '' : String(c);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(',')).join('\r\n');
  downloadBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }),
    `transplant-case_${(S.meta.caseId || 'export').replace(/[^\w.-]+/g, '_')}_${iso(TODAY())}.csv`);
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function toast(msg, bad) {
  const t = el('div', { class: 'toast' + (bad ? ' bad' : ''), text: msg });
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3200);
}

/* ------------------------------------------------------------- wiring */
function openSettings() {
  if (CFG.settingsPassword && !settingsUnlocked) { openSettingsGate(); return; }
  openSettingsForm();
}
function openSettingsGate() {
  const back = el('div', { class: 'modal-back' });
  const m = el('div', { class: 'modal' });
  m.appendChild(el('h2', { text: 'Settings password' }));
  m.appendChild(el('p', { class: 'sub', text: 'Enter the settings password to continue.' }));
  const row = el('div', { class: 'toolbar' });
  const pwInput = el('input', { type: 'password', class: 'search', placeholder: 'Password' });
  const go = () => {
    if (pwInput.value === CFG.settingsPassword) { settingsUnlocked = true; back.remove(); openSettingsForm(); }
    else toast('Incorrect password.', true);
  };
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  const btn = el('button', { class: 'btn', text: 'Unlock' });
  btn.addEventListener('click', go);
  row.append(pwInput, btn);
  m.appendChild(row);
  const cancel = el('button', { class: 'btn btn-ghost', text: 'Cancel', style: 'margin-top:14px' });
  cancel.addEventListener('click', () => back.remove());
  m.appendChild(cancel);
  back.appendChild(m);
  back.addEventListener('click', (e) => { if (e.target === back) back.remove(); });
  document.getElementById('modalRoot').appendChild(back);
}
function openSettingsForm() {
  const back = el('div', { class: 'modal-back' });
  const m = el('div', { class: 'modal' });
  m.appendChild(el('h2', { text: 'Settings' }));
  m.appendChild(el('p', { class: 'sub', text: 'Stored only in this browser. See the Code.gs setup comments for how to get the Apps Script URL and EmailJS IDs.' }));
  const grid = el('div', { class: 'form-grid' });
  const tmp = Object.assign({}, CFG);
  const f = (label, key, ph) => {
    const input = el('input', { type: 'text', value: tmp[key] || '', placeholder: ph || '' });
    input.addEventListener('input', (e) => { tmp[key] = e.target.value; });
    return el('label', { class: 'field' }, [el('span', { text: label }), input]);
  };
  grid.append(
    f('Google Apps Script Web App URL', 'gasUrl', 'https://script.google.com/macros/s/…/exec'),
    f('EmailJS Service ID', 'emailjsService'),
    f('EmailJS Template ID', 'emailjsTemplate'),
    f('EmailJS Public Key', 'emailjsPublicKey'),
    f('Password to view the donor/recipient list', 'viewPassword', 'Leave blank for no password'),
    f('Password to open a case (Overview & checklists)', 'casePassword', 'Leave blank for no password'),
    f('Password to open Settings', 'settingsPassword', 'Leave blank for no password'),
  );
  m.appendChild(grid);

  const backupNote = card('Local backup (optional)', 'Save or load a plain .json copy of the currently open case, independent of the cloud.');
  const bRow = el('div', { class: 'toolbar' });
  const bSave = el('button', { class: 'btn btn-ghost', text: 'Save case file' });
  bSave.addEventListener('click', saveCase);
  const bLoad = el('button', { class: 'btn btn-ghost', text: 'Load case file' });
  const fi = document.getElementById('fileInput');
  bLoad.addEventListener('click', () => fi.click());
  bRow.append(bSave, bLoad);
  backupNote.appendChild(bRow);
  m.appendChild(backupNote);

  const actions = el('div', { class: 'modal-actions' });
  const cancel = el('button', { class: 'btn btn-ghost', text: 'Close' });
  cancel.addEventListener('click', () => back.remove());
  const save = el('button', { class: 'btn', text: 'Save settings' });
  save.addEventListener('click', () => { CFG = tmp; saveCfg(); back.remove(); toast('Settings saved.'); if (activeTab === 'registry') render(); });
  actions.append(cancel, save);
  m.appendChild(actions);

  back.appendChild(m);
  back.addEventListener('click', (e) => { if (e.target === back) back.remove(); });
  document.getElementById('modalRoot').appendChild(back);
}

function init() {
  document.getElementById('btnHome').addEventListener('click', () => { activeTab = 'registry'; registryView = 'home'; registryUnlocked = false; render(); });
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    activeTab = t.dataset.tab;
    if (activeTab === 'registry') { registryView = 'home'; registryUnlocked = false; }
    render();
  }));
  document.getElementById('btnCloudSave').addEventListener('click', () => cloudSave(false));
  document.getElementById('btnExportSheet').addEventListener('click', exportSheetClick);
  document.getElementById('btnRemind').addEventListener('click', sendReminder);
  document.getElementById('btnCsv').addEventListener('click', exportCsv);
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
  document.getElementById('btnSettings').addEventListener('click', openSettings);
  const fi = document.getElementById('fileInput');
  fi.addEventListener('change', (e) => { if (e.target.files[0]) loadCase(e.target.files[0]); e.target.value = ''; });
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  markClean();
  render();
}
document.addEventListener('DOMContentLoaded', init);

</script>
